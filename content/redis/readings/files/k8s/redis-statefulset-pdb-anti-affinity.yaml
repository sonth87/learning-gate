# ============================================================================
# Triển Khai Redis Cluster Trên Kubernetes: StatefulSet + Anti-Affinity + PDB
# Đảm bảo mỗi Pod nằm trên một Worker Node vật lý khác nhau và không bị trục xuất đồng loạt
# ============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cluster-pdb
  namespace: data-tier
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: data-tier
spec:
  serviceName: redis-cluster-headless
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cluster
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: redis-cluster
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:8.0-alpine
          ports:
            - name: client
              containerPort: 6379
            - name: gossip
              containerPort: 16379
          resources:
            requests:
              cpu: "1000m"
              memory: "8Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 40Gi
