apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-api-config
  namespace: production
data:
  LOG_LEVEL: "info"
  FEATURE_FAST_CHECKOUT: "true"
  RATE_LIMIT_RPM: "120"
  feature-flags.json: |
    {
      "newSearch": true,
      "maxCartItems": 50
    }
---
# LƯU Ý THỰC TẾ: Không commit Secret thật dạng plain-text lên Git!
# Ở Production thật, Secret được tạo bởi External Secrets Operator / SealedSecrets từ Vault hoặc AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: shop-api-secrets
  namespace: production
type: Opaque
stringData:
  DATABASE_URL: "postgres://shop_user:<REDACTED_PLACEHOLDER>@postgres.database.svc.cluster.local:5432/shop"
  WEBHOOK_SIGNING_SECRET: "<REDACTED_WEBHOOK_PLACEHOLDER>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
    spec:
      containers:
        - name: api
          image: ghcr.io/acme-corp/shop-api:1.5.0
          envFrom:
            - configMapRef:
                name: shop-api-config
            - secretRef:
                name: shop-api-secrets
          volumeMounts:
            - name: flags-vol
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: flags-vol
          configMap:
            name: shop-api-config
            items:
              - key: feature-flags.json
                path: feature-flags.json
