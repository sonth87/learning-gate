# SỰ CỐ: Pod kẹt cứng ở trạng thái "CreateContainerConfigError" trước cả khi kịp chạy dòng code đầu tiên!
# Chạy "kubectl describe pod billing-worker-..." thấy thông báo:
# Error: couldn't find key DB_PASS in Secret default/billing-db-secret
apiVersion: v1
kind: Secret
metadata:
  name: billing-db-secret
  namespace: default
type: Opaque
stringData:
  # Trong Secret đặt tên khoá là "DATABASE_PASSWORD"
  DATABASE_PASSWORD: "<REDACTED_DEV_PLACEHOLDER>"
---
apiVersion: v1
kind: Pod
metadata:
  name: billing-worker
  namespace: default
spec:
  containers:
    - name: worker
      image: ghcr.io/acme-corp/billing-worker:1.0.2
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: billing-db-secret
              # LỖI: Lại gọi tìm khoá "DB_PASS" không hề tồn tại trong billing-db-secret!
              key: DB_PASS
