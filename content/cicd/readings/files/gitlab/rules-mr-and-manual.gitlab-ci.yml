# Quản trị điều kiện chạy linh hoạt bằng `rules:` trên GitLab CI:
# - Ngăn chặn tình trạng chạy trùng lặp kép (Duplicate Pipelines) khi vừa push nhánh vừa mở Merge Request
# - Chặn cổng Production bằng nút bấm phê duyệt thủ công `when: manual` có khoá chặn `allow_failure: false`
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - release

default:
  image: node:22-alpine

verify_mr:
  stage: test
  script:
    - npm ci
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: release
  environment:
    name: production
    url: https://shop.example.invalid
  script:
    - echo "Promoting verified release $CI_COMMIT_SHORT_SHA to Production..."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
