<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="55%" stop-color="#020617" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="gateArch" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="36" y1="14" x2="50" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Outer Learning Gate Portal Arch -->
  <path
    d="M14 50V27C14 17.0589 22.0589 9 32 9C41.9411 9 50 17.0589 50 27V50"
    stroke="url(#gateArch)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Gate Pillars Base -->
  <path
    d="M10 50H20M44 50H54"
    stroke="#38BDF8"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Python Prompt '>_' Inside the Gate -->
  <path
    d="M23 26L31 32.5L23 39"
    stroke="#34D399"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M34 39H42"
    stroke="#F59E0B"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Golden Knowledge Star / Node at Top Arch -->
  <circle cx="32" cy="18" r="3" fill="url(#sparkGrad)" />
</svg>
